name: Build and publish CI container

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Dockerfile.ci"
      - "requirements.txt"
      - ".github/workflows/build-image.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/jetpulse
          tags: |
            type=raw,value=ci
          labels: |
            org.opencontainers.image.title=JetPulse CI image
            org.opencontainers.image.description=Prebuilt image for JetPulse flight checks (Python deps, Camoufox browser, openvpn).

      - name: Build and push
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: Dockerfile.ci
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH user/packages/container/jetpulse \
            -f visibility=public

      - name: Smoke-test the published image
        run: |
          docker run --rm ghcr.io/${{ github.repository_owner }}/jetpulse:ci \
            bash -lc 'set -e
            openvpn --version >/dev/null
            sudo -n true
            test -d "$HOME/.cache/camoufox"
            python -m camoufox version >/dev/null
            python -c "import curl_cffi, requests, supabase, playwright"'
